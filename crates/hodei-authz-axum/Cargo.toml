[package]
name = "hodei-authz-axum"
version = "0.1.1"
edition = "2024"
authors = ["Ruben Dario Cabrera Garcia <rubentxu74@gmail.com>"]
description = "Axum web framework integration for Hodei authorization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rubentxu/hodei-authz"
documentation = "https://docs.rs/hodei-authz-axum"
